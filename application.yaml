port: 18080
room:
  max_members: 8
  disconnect_grace_seconds: 30
media:
  udp_port_min: 40000
  udp_port_max: 40100
  public_ip: 127.0.0.1
screen_share:
  max_width: 1280
  max_height: 720
  max_frame_rate: 24
  bitrate_rules:
    - max_viewers: 1
      max_bitrate_bps: 3500000
    - max_viewers: 2
      max_bitrate_bps: 1200000
    - max_viewers: 3
      max_bitrate_bps: 1200000
    - max_viewers: 8
      max_bitrate_bps: 800000
auth:
  enabled: false
storage:
  kind: sqlite
  sqlite:
    path: remote-voice.db
