services:
  voice:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Host networking makes WebRTC ICE host candidates and ephemeral UDP
    # media sockets reachable to LAN clients instead of Docker bridge only.
    network_mode: host

  nginx:
    image: nginx
    restart: unless-stopped
    depends_on:
      - voice
    ports:
      - "80:80"
      - "10000:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
