<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Voice Room</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/room.js"></script>
  </head>
  <body data-page="voice-room">
    <main class="room-shell">
      <header class="room-topbar">
        <div class="room-heading">
          <p class="eyebrow">语音房间</p>
          <h1>房间 <span id="room-id">--</span></h1>
        </div>
        <div class="room-meta">
          <span id="room-connection" class="status-pill">未连接</span>
          <a class="quiet-button" href="/">离开</a>
        </div>
      </header>

      <div id="room-error" class="room-alert" role="status" hidden></div>

      <section class="room-grid">
        <section id="side-panel" class="members-pane" aria-labelledby="members-title">
          <div class="pane-head">
            <div>
              <h2 id="members-title">成员</h2>
              <span id="members-meta" class="meta-copy">等待房间状态</span>
            </div>
            <div class="panel-tabs" role="tablist" aria-label="侧栏视图">
              <button id="members-tab" class="panel-tab panel-tab-active" type="button" data-panel="members">
                成员
              </button>
              <button id="chat-tab" class="panel-tab" type="button" data-panel="chat">
                聊天
              </button>
              <button id="screen-tab" class="panel-tab" type="button" data-panel="screen">
                共享
              </button>
              <span id="chat-unread" class="chat-unread" hidden></span>
            </div>
          </div>

          <div id="member-list" class="member-list" aria-label="成员列表"></div>
          <div id="mention-reminder" class="mention-reminder" role="status" aria-live="polite" hidden>
            <strong id="mention-reminder-title"></strong>
            <span id="mention-reminder-text"></span>
          </div>
          <section id="chat-panel" class="chat-panel" aria-label="文字聊天" hidden>
            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
            <form id="chat-form" class="chat-form">
              <div id="mention-picker" class="mention-picker" role="listbox" aria-label="@ 成员候选" hidden></div>
              <textarea
                id="chat-input"
                maxlength="500"
                rows="3"
                aria-label="聊天消息"
                placeholder="输入文字消息"
              ></textarea>
              <button id="chat-send" type="submit">发送</button>
            </form>
          </section>
          <section id="screen-panel" class="screen-panel" aria-label="屏幕共享" hidden>
            <div class="screen-panel-head">
              <div>
                <strong id="screen-share-title">当前没有屏幕共享</strong>
              </div>
              <button id="start-screen-share" type="button" class="quiet-button">开始共享屏幕</button>
            </div>
            <div id="screen-video-frame" class="screen-video-frame">
              <video id="screen-video" playsinline autoplay></video>
              <span id="screen-video-placeholder">等待共享画面</span>
            </div>
            <div class="screen-actions">
              <button id="open-screen-popout" type="button" class="quiet-button" disabled>弹窗</button>
              <button id="fullscreen-screen-share" type="button" class="quiet-button" disabled>全屏</button>
              <button id="stop-screen-share" type="button" class="quiet-button" hidden>停止共享</button>
            </div>
          </section>
        </section>

        <aside class="voice-pane" aria-labelledby="voice-title">
          <div class="pane-head">
            <h2 id="voice-title">本地语音</h2>
            <span class="meta-copy">单房间会话</span>
          </div>
          <label class="volume-control microphone-gain-control">
            <span>输入音量</span>
            <input
                    id="microphone-gain"
                    type="range"
                    min="0"
                    max="2"
                    step="0.05"
                    value="1"
            />
            <strong id="microphone-gain-value">100%</strong>
          </label>


          <button id="mic-state" class="mic-button" type="button" disabled>
            <span aria-hidden="true"></span>
            麦克风未连接
          </button>

          <div class="signal-stack">
            <p>
              <span>设备状态</span>
              <strong id="device-state">未请求权限</strong>
            </p>
            <p>
              <span>媒体状态</span>
              <strong id="media-state">等待连接</strong>
            </p>
            <p>
              <span>下行音频</span>
              <strong id="downlink-state">等待其他成员</strong>
            </p>
          </div>

          <div id="permission-note" class="permission-note">麦克风权限待确认。</div>

          <div class="voice-actions">
            <button id="mute-self" type="button" class="quiet-button quiet-button-wide" disabled>
              静音
            </button>
            <button id="leave-room" type="button" class="quiet-button quiet-button-wide">
              断开
            </button>
          </div>
        </aside>
      </section>
      <div id="screen-popout" class="screen-popout" hidden>
        <div class="screen-popout-surface">
          <div class="screen-popout-head">
            <strong id="screen-popout-title">屏幕共享</strong>
            <div>
              <button id="popout-fullscreen-screen-share" type="button" class="quiet-button">全屏</button>
              <button id="close-screen-popout" type="button" class="quiet-button">关闭</button>
            </div>
          </div>
          <div id="screen-popout-frame" class="screen-video-frame screen-popout-frame">
            <video id="screen-popout-video" playsinline autoplay></video>
          </div>
        </div>
      </div>
      <div id="remote-audio" hidden aria-hidden="true"></div>
    </main>
  </body>
</html>
