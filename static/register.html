<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - Remote Voice</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/auth-page.js"></script>
  </head>
  <body data-page="auth">
    <main class="auth-shell">
      <form id="register-form" class="auth-panel">
        <p class="eyebrow">Remote Voice</p>
        <h1>注册</h1>
        <label class="field">
          <span>邀请码</span>
          <input name="code" autocomplete="off" required>
        </label>
        <label class="field">
          <span>用户名</span>
          <input name="username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>显示名</span>
          <input name="display_name" autocomplete="nickname" required>
        </label>
        <label class="field">
          <span>密码</span>
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <div id="auth-error" class="inline-message" role="status" hidden></div>
        <button type="submit">注册</button>
      </form>
    </main>
  </body>
</html>
